name: Nightly stats fetch

on:
  schedule:
    # 23:30 UTC every night
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest stock & crypto stats
        run: node scripts/fetch-stats.mjs

      - name: Fetch latest KINO daily close
        run: node scripts/fetch-kino.mjs

      - name: Recompute KINO stats
        run: node scripts/analyze-kino.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: nightly stats update ($(date -u +%Y-%m-%d))"
            git push
          fi

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # nightly-fetch.yml commits with the default GITHUB_TOKEN, and GitHub
  # deliberately does not let GITHUB_TOKEN-authored pushes trigger other
  # workflows' `push` events (anti-recursion safeguard) — so without this,
  # a nightly data commit never redeploys the site. workflow_run isn't
  # subject to that restriction, so it picks up the slack.
  workflow_run:
    workflows: ["Nightly stats fetch"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Explicitly check out main's current tip, not
      # github.event.workflow_run.head_sha: that field is fixed to whatever
      # commit was HEAD when the "Nightly stats fetch" run *started* — it
      # does NOT advance to the commit that run creates and pushes during
      # its own execution. Using it here silently deployed yesterday's data
      # every night. This job only starts after that workflow (and its
      # push) has fully completed, so main's tip is always the right commit.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # GitHub Pages has no server-side routing: a direct link to a
      # client-side route like /kino would 404 without this. Serving the
      # SPA shell as the 404 page lets react-router pick up the URL and
      # render the right page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
